            <div class="sidebar">
            <h1>Contact Information</h1>

             <div class="row">
            <div class="content"><h2>Contact Us</h2></div>
            <form action="" method="post" class="contact-form">

            <label for="full name">Full Name:</label>
            <input type="text" id="full name" placeholder="Enter your name" required/><br></br>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required/><br></br>
            
            <label for="phone">Phone Number:</label>
            <input type="number" id="phone" placeholder="Enter your phone number" required/><br></br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password" required/><br></br>
            
            <label for="subject">Subject:</label>
             <select name="Subject" id="subject" required>
                <option value="">Select your subject line</option>
                <option value="ams">AMS </option>
                <option value="elearning">elearning</option>
                <option value="technical">Technical</option>
                <option value="general">General Inquiry</option>
            </select> <br></br>

            <label for="message">Message:</label> <br></br>
            <textarea placeholder="Enter your message here..." required></textarea><br></br>
            <input type="submit" value="Update Message"/> <br></br>  
            <button type="submit">Send Message</button> <br></br>
            <!-- <input type="reset" value="Reset Form"/> <br></br> -->

            </form>
            </div>
