<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        body {
            margin: 0;

        }
        .container {
            width: 500px;
            height: 500px;
            background-color: lightblue;
            padding: 40px; /* Space inside the box */
            
        }
        .inner-box {
            width: 250px;
            height: 250px;
            background-color: lightcoral;
            border: 5px 20px 10px 15px; /* Border around the inner box */
            border-style: solid;
            border-color: brown purple black green; /* Border color */
            margin: 100px 5px 50px 85px; /* Space outside the box */


        }
    </style>
</head>
<body>
    <div class="container">
        <div class="inner-box"></div>
    </div>
    
</body>
</html>
